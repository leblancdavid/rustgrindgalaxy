<!DOCTYPE html><html><head><meta charset="utf-8"><title>Jump Preview</title>
<style>body{background:#101014;color:#e8e8e8;font-family:monospace;padding:20px}
canvas{image-rendering:pixelated;background:#1a1a22;border:1px solid #3a3d48}
.lbl{margin-top:10px;color:#9a9a90}</style></head><body>
<h3>Player Jump (animate_image from c13 base, 9 frames @ 8fps)</h3>
<canvas id="c"></canvas><div class="lbl">loops: thrust flare -> rise -> apex (no thrust) -> return</div>
<script>
const F=[0,1,2,3,4,5,6,7,8].map(i=>new Image());
F.forEach((im,k)=>im.src='jump_'+String(k).padStart(2,'0')+'.png');
const cv=document.getElementById('c'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;
let i=0,last=0,init=false;
function loop(t){requestAnimationFrame(loop);if(!init)return;if(t-last<125)return;last=t;
x.clearRect(0,0,cv.width,cv.height);x.drawImage(F[i%F.length],0,0,cv.width,cv.height);i++;}
F[0].onload=()=>{if(init)return;init=true;cv.width=64*5;cv.height=64*5;requestAnimationFrame(loop);};
</script></body></html>
